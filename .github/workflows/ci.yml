name: ci
# Runs on the PUBLIC copy of the repo (free Actions minutes). In the private source repo every job
# is skipped, so pushes there cost no minutes. Pipeline:
#   gate (typecheck, unit/balance tests, build, budget)
#     ├─ e2e            Playwright on a 390x844 touch viewport + small-phone check
#     └─ apk            Capacitor Android build, signed with the repo's release key
#          └─ device-smoke   install + play on an Android emulator (screenshots as artifacts)
#   release (main only, after e2e + device-smoke): rolling "playtest" pre-release with the APK
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ci

  e2e:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test
      - run: npx playwright test
      # Screenshots only when something failed; never fail the job on artifact storage quota.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with: { name: e2e-screenshots, path: e2e/__shots__, if-no-files-found: ignore, retention-days: 3 }

  apk:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "BR_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret (fork or new repo): building a debug-signed APK"
          fi
      - name: Gradle build
        working-directory: android
        env:
          BR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          TASK=assembleRelease
          [ -n "${BR_KEYSTORE_FILE:-}" ] || TASK=assembleDebug
          # Release builds also produce the Play Store bundle (AAB) from the same key and version.
          [ "$TASK" = assembleRelease ] && TASK="assembleRelease bundleRelease"
          ./gradlew --no-daemon $TASK -PversionCode=${{ github.run_number }} -PversionName="$VERSION-build.${{ github.run_number }}"
      - name: Verify signature and manifest
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' | head -1)
          [ -n "$APK" ] || { echo "no signed APK produced"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)"
          mkdir -p out && cp "$APK" out/borderline-rich.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then
            jarsigner -verify -certs "$AAB" | tail -3
            cp "$AAB" out/borderline-rich.aab
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: borderline-rich-apk, path: out/borderline-rich.apk, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: borderline-rich-aab, path: out/borderline-rich.aab, retention-days: 30, if-no-files-found: ignore }

  device-smoke:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    needs: apk
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: borderline-rich-apk, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/android-smoke.sh out/borderline-rich.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-smoke, path: smoke, if-no-files-found: ignore, retention-days: 14 }

  release:
    if: ${{ !github.event.repository.private && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [e2e, device-smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: borderline-rich-apk, path: out }
      - uses: actions/download-artifact@v4
        with: { name: borderline-rich-aab, path: out }
        continue-on-error: true
      - name: Publish the rolling "playtest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete playtest --cleanup-tag --yes || true
          cat > notes.md <<EOF
          Latest build of \`main\` that passed every check (unit/balance tests, Playwright e2e, Android emulator smoke test).

          - Commit: ${GITHUB_SHA}
          - Build: #${{ github.run_number }}

          **Install:** open this page on an Android phone (Android 7+), download \`borderline-rich.apk\` and allow installs from your browser when asked. New builds install over old ones and keep your save.

          In-app purchases in this build are sandbox purchases: no real money is charged.
          EOF
          gh release create playtest out/borderline-rich.* --target "$GITHUB_SHA" --prerelease \
            --title "Playtest build #${{ github.run_number }}" --notes-file notes.md
