name: ci
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ci
  e2e:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test
      - run: npx playwright test
      # Screenshots only when something failed; never fail the job on artifact storage quota.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with: { name: e2e-screenshots, path: e2e/__shots__, if-no-files-found: ignore, retention-days: 3 }
